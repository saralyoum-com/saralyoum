<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>SARD — بوست السعر الصباحي</title>
<meta name="hz:slide-selector" content=".post">
<meta name="hz:canvas-width" content="1080">
<meta name="hz:canvas-height" content="1080">
<style>
@font-face{font-family:'Tajawal';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,__FONT_BOLD__) format('woff2');}
@font-face{font-family:'Tajawal';font-weight:800;font-style:normal;src:url(data:font/woff2;base64,__FONT_XBOLD__) format('woff2');}

*{margin:0;padding:0;box-sizing:border-box;}
body{margin:0;background:#141418;}

.post{
  position:relative;width:1080px;height:1080px;overflow:hidden;
  background:#09090F;direction:rtl;
  font-family:'Tajawal',sans-serif;
}

/* warm falloff from the upper right — the house light direction */
.glow{
  position:absolute;top:-320px;right:-240px;width:920px;height:920px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,168,76,0.17) 0%,rgba(201,168,76,0.05) 42%,rgba(201,168,76,0) 70%);
}
.vignette{
  position:absolute;top:0;left:0;width:1080px;height:1080px;
  background:radial-gradient(ellipse at 62% 40%,rgba(0,0,0,0) 40%,rgba(0,0,0,0.5) 100%);
}

/* ── header ─────────────────────────────────────────────── */
.logo{position:absolute;top:52px;right:60px;width:172px;height:172px;}

.live{
  position:absolute;top:78px;left:64px;
  display:flex;align-items:center;gap:11px;
  padding:10px 22px 10px 18px;border-radius:100px;
  background:rgba(34,197,94,0.10);border:1px solid rgba(34,197,94,0.30);
}
.live-dot{width:10px;height:10px;border-radius:50%;background:#4ade80;}
.live-txt{font-family:'Tajawal',sans-serif;font-weight:800;font-size:23px;color:#4ade80;line-height:1;}

.date{
  position:absolute;top:140px;left:66px;display:flex;gap:9px;direction:rtl;
  font-family:'Tajawal',sans-serif;font-weight:700;font-size:24px;color:#6E6E78;
}

/* ── hero ───────────────────────────────────────────────── */
.hero{position:absolute;top:262px;right:64px;width:952px;}

.eyebrow{
  font-family:'Tajawal',sans-serif;font-weight:800;font-size:29px;color:#C9A84C;
  letter-spacing:2px;margin-bottom:16px;
}

.hero-line{display:flex;width:952px;justify-content:space-between;align-items:center;}

.price-row{display:flex;align-items:flex-start;gap:16px;direction:ltr;}
.currency{
  font-family:'Tajawal',sans-serif;font-weight:800;font-size:58px;color:rgba(201,168,76,0.5);
  line-height:1;margin-top:30px;
}
.price{
  font-family:'Tajawal',sans-serif;font-weight:800;font-size:158px;line-height:1;
  background:linear-gradient(160deg,#F3E4AE 0%,#C9A84C 48%,#A8872E 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:-3px;
}

.chip{
  display:flex;align-items:center;gap:10px;direction:ltr;
  padding:15px 28px;border-radius:100px;
  background:rgba(34,197,94,0.10);border:1px solid rgba(34,197,94,0.32);
}
.chip-arrow{font-family:'Tajawal',sans-serif;font-weight:800;font-size:27px;color:#22c55e;line-height:1;}
.chip-txt{font-family:'Tajawal',sans-serif;font-weight:800;font-size:36px;color:#22c55e;line-height:1;}

.unit{
  margin-top:20px;
  font-family:'Tajawal',sans-serif;font-weight:700;font-size:26px;color:#8A8A94;
}

/* ── divider ────────────────────────────────────────────── */
.rule{
  position:absolute;top:566px;right:64px;width:952px;height:1px;
  background:linear-gradient(to left,rgba(201,168,76,0) 0%,rgba(201,168,76,0.4) 22%,rgba(201,168,76,0.4) 78%,rgba(201,168,76,0) 100%);
}
.table-label{
  position:absolute;top:594px;right:64px;
  font-family:'Tajawal',sans-serif;font-weight:800;font-size:25px;color:#5E5E68;letter-spacing:1.5px;
}

/* ── country rows ───────────────────────────────────────── */
/* flex, not absolute coordinates: Arabic country and currency names
   vary in width, and pixel-placed columns collide the moment they do. */
.rows{position:absolute;top:648px;right:64px;width:952px;}
.row{
  display:flex;align-items:center;justify-content:space-between;
  height:100px;width:952px;margin-bottom:14px;padding:0 30px;
  background:#131318;border:1px solid #24242C;border-radius:20px;
}
.row-id{display:flex;align-items:center;gap:20px;}
.row-accent{width:4px;height:46px;border-radius:4px;background:#C9A84C;}
.row-name{font-family:'Tajawal',sans-serif;font-weight:800;font-size:35px;color:#EDEDF2;}

.row-money{display:flex;align-items:baseline;gap:12px;}
.row-price{font-family:'Tajawal',sans-serif;font-weight:800;font-size:42px;color:#C9A84C;}
.row-cur{font-family:'Tajawal',sans-serif;font-weight:700;font-size:22px;color:#6E6E78;}

.row-chg{
  display:flex;align-items:center;gap:8px;direction:ltr;
  padding:9px 17px;border-radius:100px;
  font-family:'Tajawal',sans-serif;font-weight:800;font-size:25px;line-height:1;
}
.up{color:#22c55e;background:rgba(34,197,94,0.10);}
.down{color:#ef4444;background:rgba(239,68,68,0.10);}

/* ── footer ─────────────────────────────────────────────── */
.foot-rule{position:absolute;top:1002px;right:64px;width:952px;height:1px;background:#22222A;}
.handle{
  position:absolute;top:1024px;right:64px;direction:ltr;
  font-family:'Tajawal',sans-serif;font-weight:800;font-size:26px;color:#C9A84C;
}
.site{
  position:absolute;top:1026px;left:64px;direction:ltr;
  font-family:'Tajawal',sans-serif;font-weight:700;font-size:24px;color:#55555E;
}
</style>
</head>
<body>
<div class="post" data-canvas-width="1080" data-canvas-height="1080">

  <div class="glow"></div>
  <div class="vignette"></div>

  <img class="logo" src="data:image/png;base64,__LOGO__" width="172" height="172" alt="SARD">

  <div class="live"><span class="live-dot"></span><span class="live-txt">مباشر</span></div>
  <div class="date"><span>2</span><span>سبتمبر</span><span>2026</span></div>

  <div class="hero">
    <div class="eyebrow">سعر الذهب عيار 24</div>
    <div class="hero-line">
      <div class="price-row">
        <span class="currency">$</span>
        <span class="price">3,347</span>
      </div>
      <div class="chip"><span class="chip-arrow">&#9650;</span><span class="chip-txt">0.62%</span></div>
    </div>
    <div class="unit">للأونصة · دولار أمريكي</div>
  </div>

  <div class="rule"></div>
  <div class="table-label">سعر الجرام عيار 24</div>

  <div class="rows">
    <div class="row">
      <div class="row-id"><span class="row-accent"></span><span class="row-name">السعودية</span></div>
      <div class="row-money"><span class="row-price">403.54</span><span class="row-cur">ريال سعودي</span></div>
      <div class="row-chg up"><span>&#9650;</span><span>0.62%</span></div>
    </div>
    <div class="row">
      <div class="row-id"><span class="row-accent"></span><span class="row-name">الإمارات</span></div>
      <div class="row-money"><span class="row-price">394.94</span><span class="row-cur">درهم إماراتي</span></div>
      <div class="row-chg up"><span>&#9650;</span><span>0.58%</span></div>
    </div>
    <div class="row">
      <div class="row-id"><span class="row-accent"></span><span class="row-name">الكويت</span></div>
      <div class="row-money"><span class="row-price">33.04</span><span class="row-cur">دينار كويتي</span></div>
      <div class="row-chg down"><span>&#9660;</span><span>0.14%</span></div>
    </div>
  </div>

  <div class="foot-rule"></div>
  <div class="handle">@sardhahab</div>
  <div class="site">sardhahab.com</div>

</div>
</body>
</html>
